<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Light Lab: Act 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#060a14; --ink2:#0b1224; --panel:#101a33; --panel2:#142142; --line:#25365f;
  --tx:#eaf1ff; --mut:#9db0d6; --ok:#5ee79a; --bad:#ff6b7a; --warn:#ffd23d;
  --c:#38b6ff; /* per-activity spectrum colour, overridden inline */
  --r1:14px; --r2:8px;
  --f:'Lexend','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  --fh:'Noto Sans Devanagari','Nirmala UI','Mangal',sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--tx);font-family:var(--f);font-size:16px;line-height:1.55;
  background-image:radial-gradient(1200px 600px at 85% -10%,rgba(122,124,255,.16),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(56,225,255,.10),transparent 60%);
  min-height:100vh}
body.presenter{font-size:19px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px;border-radius:6px}
.hi{font-family:var(--fh);color:#cfe3ff;background:rgba(255,200,87,.08);border-left:3px solid var(--warn);padding:8px 12px;margin:8px 0;border-radius:0 8px 8px 0;font-size:.95em;line-height:1.7}
.hi:empty{display:none}
.hide{display:none!important}

/* ---------- header ---------- */
#top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:10px 18px;padding-top:max(10px,env(safe-area-inset-top));
  background:rgba(6,10,20,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;cursor:pointer;background:none;border:0;padding:0}
.logo svg{width:34px;height:34px;flex:none}
.logo small{display:block;font-weight:400;color:var(--mut);font-size:.72rem;line-height:1.1}
.prog{flex:1;max-width:420px;margin-left:auto}
.prog .bar{height:10px;border-radius:99px;background:#17244a;overflow:hidden;border:1px solid var(--line)}
.prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff4d4d,#ff8a3d,#ffd23d,#7be04a,#2fd6b0,#38b6ff,#7a7cff,#c15bff);transition:width .5s}
.prog span{font-size:.75rem;color:var(--mut)}
.tbtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:40px;font-size:.85rem;white-space:nowrap}
.tbtn:hover{background:var(--panel2)}
.tbtn[aria-pressed=true]{background:#3a2d0b;border-color:var(--warn);color:var(--warn)}

/* ---------- layout ---------- */
.wrap{max-width:1440px;margin:0 auto;padding:22px 18px 80px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--c);color:#04101f;border:0;border-radius:12px;padding:11px 18px;font-weight:600;cursor:pointer;min-height:44px;transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.1)} .btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--panel)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.85rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.card{background:linear-gradient(180deg,var(--panel),var(--ink2));border:1px solid var(--line);border-radius:var(--r1)}

/* ---------- dashboard ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:30px;align-items:center;padding:28px 0 10px}
.hero h1{font-size:clamp(2rem,4.6vw,3.6rem);line-height:1.05;margin:0 0 12px;letter-spacing:-.02em}
.hero p{color:var(--mut);max-width:58ch;margin:0 0 18px;font-size:1.05rem}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap}
#prism{width:100%;height:auto;max-height:300px;border-radius:var(--r1);background:#050813;border:1px solid var(--line);touch-action:none;cursor:crosshair}
.prismcap{font-size:.8rem;color:var(--mut);margin-top:6px}
.beam{position:relative;margin:26px 0 0;padding-left:46px}
.beam:before{content:"";position:absolute;left:19px;top:10px;bottom:10px;width:4px;border-radius:4px;background:linear-gradient(#ff4d4d,#ff8a3d,#ffd23d,#7be04a,#2fd6b0,#38b6ff,#7a7cff,#c15bff);box-shadow:0 0 18px rgba(122,124,255,.5)}
.st{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;align-items:center;padding:16px 18px;margin-bottom:12px;border:1px solid var(--line);border-radius:var(--r1);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 11%,var(--panel)),var(--ink2) 70%);cursor:pointer;transition:border-color .15s,transform .15s}
.st:hover{border-color:var(--c);transform:translateX(4px)}
.st .node{position:absolute;left:-36px;top:50%;translate:0 -50%;width:34px;height:34px;border-radius:50%;background:var(--c);color:#04101f;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 5px var(--ink),0 0 16px var(--c)}
.st h3{margin:0;font-size:1.15rem}
.st h3 small{font-family:var(--fh);color:var(--mut);font-weight:400;margin-left:8px;font-size:.85em}
.st p{margin:3px 0 0;color:var(--mut);font-size:.9rem;max-width:80ch}
.st .meta{display:flex;align-items:center;gap:12px}
.pips{display:flex;gap:5px}
.pips i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);display:block}
.pips i.on{background:var(--c);border-color:var(--c);box-shadow:0 0 8px var(--c)}
.mins{font-size:.78rem;color:var(--mut);white-space:nowrap}
.panelrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-top:26px}
.panelrow .card{padding:18px}
.panelrow h2{margin:0 0 8px;font-size:1.1rem}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:500}
.final{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* ---------- activity ---------- */
.acthead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.acthead h1{margin:0;font-size:clamp(1.4rem,2.6vw,2.1rem);line-height:1.15}
.acthead h1 small{font-family:var(--fh);font-weight:400;color:var(--mut);font-size:.6em;margin-left:8px}
.anum{background:var(--c);color:#04101f;font-weight:700;border-radius:99px;padding:3px 12px;font-size:.85rem}
.nav2{margin-left:auto;display:flex;gap:8px}
.lab{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(330px,1fr);gap:18px;align-items:start}
@media(max-width:1020px){.lab{grid-template-columns:minmax(0,1fr)}.hero{grid-template-columns:minmax(0,1fr)}}
.lab>section,.lab>aside{min-width:0}
.stage{position:relative;border-radius:var(--r1);border:1px solid var(--line);background:#050813;overflow:hidden;aspect-ratio:16/10;min-height:300px}
.stage canvas{width:100%;height:100%;display:block;touch-action:none}
.stage2{margin-top:12px;aspect-ratio:16/9}
.msg{position:absolute;left:50%;bottom:14px;translate:-50% 20px;opacity:0;pointer-events:none;background:rgba(10,18,40,.95);border:1px solid var(--c);color:var(--tx);padding:10px 18px;border-radius:99px;font-weight:600;max-width:92%;text-align:center;transition:.3s;z-index:3}
.msg.show{opacity:1;translate:-50% 0}
.msg.good{border-color:var(--ok);color:var(--ok)} .msg.bad{border-color:var(--bad);color:var(--bad)}
.fallback{display:grid;place-items:center;height:100%;padding:20px;text-align:center;color:var(--mut)}
.readouts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:.85rem}
.chip b{color:var(--c);font-weight:600}
.chip.ok b{color:var(--ok)} .chip.bad b{color:var(--bad)}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px 18px;padding:14px;border:1px solid var(--line);border-radius:var(--r1);background:var(--ink2)}
.ctl{display:flex;flex-direction:column;gap:6px;min-width:0}
.ctl.wide{grid-column:1/-1}
.ctl label{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;color:var(--mut)}
.ctl label b{color:var(--tx);font-weight:600;white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--line),var(--c))}
input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--line),var(--c))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:4px solid var(--c);margin-top:-9px;box-shadow:0 2px 8px #0008}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid var(--c)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:42px;font-size:.88rem}
.seg button.on{background:var(--c);color:#04101f;border-color:var(--c);font-weight:600}
.chk{display:flex;align-items:center;gap:10px;cursor:pointer;min-height:42px;font-size:.9rem}
.chk input{width:22px;height:22px;accent-color:var(--c)}
.txt{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:42px;width:100%;font-weight:600;letter-spacing:.05em}
.cbtn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;min-height:42px;font-size:.88rem}
.cbtn:hover{border-color:var(--c)}
.cbtn.reset{border-style:dashed}
.btnrow{flex-direction:row;flex-wrap:wrap}

/* ---------- guide panel ---------- */
.guide{position:sticky;top:76px;max-height:calc(100vh - 92px);display:flex;flex-direction:column;overflow:hidden}
@media(max-width:1020px){.guide{position:static;max-height:none}}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:12px 8px;cursor:pointer;color:var(--mut);font-size:.82rem;white-space:nowrap;min-height:48px}
.tabs button.on{color:var(--tx);border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}
.tabs button .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-left:5px;vertical-align:middle}
.tabbody{padding:16px 18px 22px;overflow-y:auto;flex:1}
.tabbody h4{margin:16px 0 6px;font-size:.95rem;color:var(--c)}
.tabbody h4:first-child{margin-top:0}
.tabbody p{margin:6px 0}
.tabbody ul{margin:6px 0;padding-left:20px}
.tabbody li{margin:4px 0}
.steps{list-style:none;padding:0!important;margin:8px 0}
.steps li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;margin:6px 0;background:var(--ink2)}
.steps li.done{border-color:var(--ok);background:rgba(94,231,154,.07)}
.steps input{width:22px;height:22px;accent-color:var(--ok)}
.note{border:1px dashed var(--warn);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:.9rem;background:rgba(255,210,61,.05)}
.opts{display:grid;gap:8px;margin:10px 0}
.opt{display:flex;gap:10px;align-items:center;text-align:left;background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer;min-height:48px}
.opt:hover:not([disabled]){border-color:var(--c)}
.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--ink2))}
.opt.right{border-color:var(--ok);background:rgba(94,231,154,.12)}
.opt.wrong{border-color:var(--bad);background:rgba(255,107,122,.1);opacity:.75}
.fb{margin:10px 0;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--ink2)}
.fb.good{border-color:var(--ok)} .fb.bad{border-color:var(--bad)}
.take{font-size:1.15rem;line-height:1.5;padding:16px;border-radius:12px;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--ink2))}
.tick{display:grid;grid-template-columns:auto 1fr;gap:8px;margin:12px 0}
.tick span{display:contents}
.formula{font-size:1.1rem;padding:8px 14px;border-radius:10px;background:var(--ink2);border:1px solid var(--line);display:inline-block;margin:4px 6px 4px 0}

/* ---------- final quiz ---------- */
.quizbox{max-width:760px;margin:20px auto;padding:24px}
.quizbox h2{margin-top:0}
.score{font-size:3rem;font-weight:700;color:var(--c)}
#toast{position:fixed;left:50%;bottom:22px;translate:-50% 30px;opacity:0;background:var(--panel2);border:1px solid var(--ok);padding:10px 18px;border-radius:99px;z-index:90;transition:.35s;pointer-events:none}
#toast.show{opacity:1;translate:-50% 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media(max-width:640px){.stage{aspect-ratio:auto;height:min(82vw,400px);min-height:240px}.stage2{height:min(70vw,320px)}.acthead h1{font-size:1.3rem}#top{flex-wrap:wrap}.prog{order:5;flex-basis:100%;max-width:none}.st{grid-template-columns:1fr}.beam{padding-left:40px}}
</style>
</head>
<body>
<header id="top">
  <button class="logo" id="logoBtn" aria-label="Go to dashboard">
    <svg viewBox="0 0 40 40" aria-hidden="true"><polygon points="20,5 36,33 4,33" fill="none" stroke="#eaf1ff" stroke-width="2.4" stroke-linejoin="round"/><line x1="1" y1="22" x2="14" y2="21" stroke="#fff" stroke-width="2.4"/><line x1="25" y1="20" x2="39" y2="12" stroke="#ff4d4d" stroke-width="2"/><line x1="26" y1="23" x2="39" y2="22" stroke="#7be04a" stroke-width="2"/><line x1="26" y1="26" x2="39" y2="32" stroke="#7a7cff" stroke-width="2"/></svg>
    <span>Light Lab<small>Physics Workshop, Classes 6 to 10</small></span>
  </button>
  <div class="prog" aria-label="Overall progress"><div class="bar"><i id="pbar"></i></div><span id="ptxt">0% complete</span></div>
  <button class="tbtn" id="presBtn" aria-pressed="false" title="Larger text for projectors">Projector mode</button>
</header>
<main id="view" class="wrap"></main>
<div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const ONLY = 5;
/* =====================================================================
   LIGHT LAB  |  Core utilities
   ===================================================================== */
const TAU = Math.PI * 2, D2R = Math.PI / 180, R2D = 180 / Math.PI;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const $ = (s, e = document) => e.querySelector(s);
const $$ = (s, e = document) => [...e.querySelectorAll(s)];
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
const FONT = '"Lexend","Segoe UI",system-ui,Arial,sans-serif';

/* ---------- canvas drawing helpers ---------- */
function rr(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function line(g, x1, y1, x2, y2, col, w, dash, alpha) {
  g.save(); g.strokeStyle = col; g.lineWidth = w || 2; g.globalAlpha = alpha == null ? 1 : alpha;
  g.setLineDash(dash || []); g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); g.restore();
}
function glow(g, x1, y1, x2, y2, col, w, alpha) {
  g.save(); g.lineCap = 'round'; g.globalAlpha = (alpha == null ? 1 : alpha);
  g.strokeStyle = col; g.shadowColor = col; g.shadowBlur = 14; g.lineWidth = w || 3;
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  g.shadowBlur = 0; g.strokeStyle = '#fff'; g.globalAlpha *= .55; g.lineWidth = Math.max(1, (w || 3) * .35);
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); g.restore();
}
function dot(g, x, y, r, col, stroke) {
  g.save(); g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = 2; g.stroke(); } g.restore();
}
function text(g, s, x, y, col, size, align, weight, base) {
  g.save(); g.fillStyle = col || '#eaf1ff'; g.font = `${weight || 500} ${size || 14}px ${FONT}`;
  g.textAlign = align || 'left'; g.textBaseline = base || 'alphabetic'; g.fillText(s, x, y); g.restore();
}
function arrowHead(g, x, y, ang, size, col) {
  g.save(); g.translate(x, y); g.rotate(ang); g.fillStyle = col; g.beginPath();
  g.moveTo(0, 0); g.lineTo(-size, -size * .45); g.lineTo(-size, size * .45); g.closePath(); g.fill(); g.restore();
}
function arrow(g, x1, y1, x2, y2, col, w, dash) {
  line(g, x1, y1, x2, y2, col, w || 2.5, dash);
  arrowHead(g, x2, y2, Math.atan2(y2 - y1, x2 - x1), 9 + (w || 2.5), col);
}
function angleArc(g, cx, cy, r, a1, a2, col, label, lblCol) {
  let d = a2 - a1; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU;
  g.save(); g.strokeStyle = col; g.lineWidth = 2.5; g.beginPath(); g.arc(cx, cy, r, a1, a1 + d, d < 0); g.stroke();
  if (label) { const m = a1 + d / 2; text(g, label, cx + Math.cos(m) * (r + 18), cy + Math.sin(m) * (r + 18), lblCol || col, 14, 'center', 600, 'middle'); }
  g.restore();
}
function gridBg(g, W, H, step, col) {
  g.save(); g.strokeStyle = col || 'rgba(120,160,255,.07)'; g.lineWidth = 1; g.beginPath();
  for (let x = 0; x < W; x += step) { g.moveTo(x + .5, 0); g.lineTo(x + .5, H); }
  for (let y = 0; y < H; y += step) { g.moveTo(0, y + .5); g.lineTo(W, y + .5); }
  g.stroke(); g.restore();
}
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const fix = (v, d = 1) => (+v).toFixed(d);

/* ---------- persistence (progress tracking) ---------- */
const Store = {
  d: { done: {}, final: null, lang: 'en', pres: false },
  load() { try { const s = localStorage.getItem('lightlab.v1'); if (s) Object.assign(this.d, JSON.parse(s)); } catch (e) { } },
  save() { try { localStorage.setItem('lightlab.v1', JSON.stringify(this.d)); } catch (e) { } },
  get(id) { return this.d.done[id] || (this.d.done[id] = { visit: 0, predict: 0, quiz: 0, task: 0 }); },
  pct(id) { const o = this.get(id); return (o.visit + o.predict + o.quiz + o.task) / 4; },
  overall() { let s = 0; ACTS.forEach(a => s += this.pct(a.id)); return Math.round(100 * (s / ACTS.length * .9 + (this.d.final != null && this.d.final >= 6 ? .1 : 0))); },
  mark(id, k) { const o = this.get(id); if (!o[k]) { o[k] = 1; this.save(); updateProgress(); toast(({ predict: 'Prediction logged', quiz: 'Quiz answered correctly', task: 'Experiment steps complete' })[k] || 'Saved'); } },
  reset() { this.d.done = {}; this.d.final = null; this.save(); updateProgress(); }
};
function updateProgress() { const p = Store.overall(); $('#pbar').style.width = p + '%'; $('#ptxt').textContent = p + '% complete'; }
let toastT; function toast(s) { const t = $('#toast'); t.textContent = '✓ ' + s; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); }
const isHi = () => false;
const bi = (en, hi) => `<div>${en}</div>` + (isHi() && hi ? `<div class="hi" lang="hi">${hi}</div>` : '');

/* =====================================================================
   SIM FRAMEWORK
   A "def" describes controls + draw(); the framework builds the UI,
   handles resizing, pointer dragging, readouts, reset and messages.
   ===================================================================== */
function mountSim(def, ui) {
  const c = document.createElement('canvas'); ui.stage.appendChild(c);
  const g = c.getContext('2d');
  const env = { def, c, g, ui, P: {}, S: {}, W: 300, H: 200, dpr: 1, t: 0, dead: false, ctl: {}, rows: [], _rd: '' };
  def.controls.forEach(s => { if (s.id) env.P[s.id] = s.val; });

/* ---------- prism hero (real Snell’s law through an equilateral prism) ---------- */
function refractV(d, nrm, n1, n2) {
  const c = -(d.x * nrm.x + d.y * nrm.y), r = n1 / n2, k = 1 - r * r * (1 - c * c); if (k < 0) return null;
  const b = r * c - Math.sqrt(k); return { x: r * d.x + b * nrm.x, y: r * d.y + b * nrm.y };
}
function startPrism(cv) {

  const size = () => { const r = cv.getBoundingClientRect(); dpr = Math.min(window.devicePixelRatio || 1, 2); W = r.width; H = r.height; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); };
  size(); const ro = new ResizeObserver(size); ro.observe(cv); CUR = { ro };
  const mv = e => { const r = cv.getBoundingClientRect(); ey = clamp((e.clientY - r.top) / r.height, .1, .9); touched = true; };
  cv.addEventListener('pointermove', mv); cv.addEventListener('pointerdown', mv);
  const cols = ['#ff3b3b', '#ff9a2e', '#ffe14d', '#4ade80', '#38b6ff', '#6366f1', '#c15bff'];
  FRAME = t => {
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H); gridBg(g, W, H, 32);
    const s = Math.min(W, H) * .6, hh = s * .866, cx = W * .44, cy = H * .5, A = { x: cx, y: cy - hh * 2 / 3 }, B = { x: cx - s / 2, y: cy + hh / 3 }, C = { x: cx + s / 2, y: cy + hh / 3 };
    if (!touched) ey = .45 + Math.sin(t * .6) * .1;
    g.beginPath(); g.moveTo(A.x, A.y); g.lineTo(B.x, B.y); g.lineTo(C.x, C.y); g.closePath(); g.fillStyle = 'rgba(150,200,255,.12)'; g.fill(); g.strokeStyle = '#cfe3ff'; g.lineWidth = 2; g.stroke();
    const y0 = clamp(ey * H, A.y + 14, B.y - 14), tq = (B.y - y0) / (B.y - A.y), P1 = { x: B.x + tq * (A.x - B.x), y: y0 };
    glow(g, 0, y0, P1.x, P1.y, '#ffffff', 4);
    g.save(); g.globalCompositeOperation = 'lighter';
    cols.forEach((c, i) => {
      const n = 1.49 + i * .012, d1 = refractV({ x: 1, y: 0 }, { x: -.866, y: -.5 }, 1, n); if (!d1) return;
      const t2 = raySeg(P1, d1, [A.x, A.y, C.x, C.y]); if (t2 == null) return; const P2 = { x: P1.x + d1.x * t2, y: P1.y + d1.y * t2 };
      const d2 = refractV(d1, { x: -.866, y: .5 }, n, 1); line(g, P1.x, P1.y, P2.x, P2.y, c, 2, [], .55); if (!d2) return;
      g.strokeStyle = c; g.lineWidth = 3; g.globalAlpha = .95; g.beginPath(); g.moveTo(P2.x, P2.y); g.lineTo(P2.x + d2.x * W, P2.y + d2.y * W); g.stroke();
    });
    g.restore();
  };
}

}
function drawTab() {
  const a = CUR.act, st = Store.get(a.id), body = $('#tabbody'), tab = CUR.tab; let h = '';
  if (tab === 'mission') {
    const sb = st.sb;
    h = `<h4>🎯 Your mission</h4><p>${a.objective}</p>
    <h4>🌍 Where you meet it</h4><ul>${a.real.map(r => `<li>${r}</li>`).join('')}</ul>${isHi() ? `<div class="hi" lang="hi">${a.hi.real}</div>` : ''}
    <h4>📘 The idea in simple words</h4>${bi(a.explain, a.hi.explain)}
    <h4>🧪 Guided experiment <span id="stcount" style="color:var(--mut);font-weight:400"></span></h4>
    <ol class="steps">${a.steps.map((s, k) => `<li data-k="${k}" class="${sb[k] ? 'done' : ''}"><input type="checkbox" data-chk="${k}" ${sb[k] ? 'checked' : ''} aria-label="Mark step ${k + 1} done"><span>${s.t}</span><button class="btn sm" data-try="${k}">Try it</button></li>`).join('')}</ol>
    <h4>👀 What to observe</h4><ul>${a.observe.map(o => `<li>${o}</li>`).join('')}</ul>
    <h4>🏆 Student challenge</h4><p>${a.challenge}</p>`;
  } else if (tab === 'predict' || tab === 'quiz') h = qHTML(tab);
  else if (tab === 'why') {
    h = `<h4>💡 Why does it happen?</h4>${bi(a.why, a.hi.why)}<h4>Key relationships</h4><div>${a.formula.map(f => `<span class="formula">${f}</span>`).join('')}</div>
    <h4>🔬 Accurate model or simplified?</h4><div class="note">${a.accuracy}</div><h4>🧑‍🏫 Facilitator tip</h4><p>${a.tip}</p>`;
  } else {
    const items = [['Visited the lab', st.visit], ['Made a prediction', st.predict], ['Answered the quiz', st.quiz], ['Finished the experiment steps', st.task]];
    h = `<h4>⭐ Key takeaway</h4><div class="take">${a.take}</div>${isHi() ? `<div class="hi" lang="hi">${a.hi.take}</div>` : ''}
    <h4>Key words</h4><div>${a.terms.map(t => `<span class="formula">${t}</span>`).join('')}</div>
    <h4>Your progress in this activity</h4><div class="tick">${items.map(x => `<span>${x[1] ? '✅' : '⬜'}</span><span>${x[0]}</span>`).join('')}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><button class="btn" data-go="${CUR.idx === ACTS.length - 1 ? '#final' : '#act-' + (a.n + 1)}">${CUR.idx === ACTS.length - 1 ? 'Go to the final quiz' : 'Next activity'}</button><button class="btn ghost" data-go="#home">Dashboard</button></div>`;
  }
  body.innerHTML = h; body.scrollTop = 0; updateStepCount();
}
function updateStepCount() { const a = CUR.act, sb = Store.get(a.id).sb, n = sb.filter(Boolean).length, e = $('#stcount'); if (e) e.textContent = `(${n} of ${a.steps.length} done)`; }
function qHTML(kind) {
  const a = CUR.act, q = a[kind], s = CUR.q[kind], hiq = a.hi[kind === 'predict' ? 'pq' : 'qq'], ok = s.done;
  const opts = q.opts.map((o, k) => { let cls = s.sel === k ? 'sel' : ''; if (ok && k === q.ans) cls = 'right'; if (s.wrong.includes(k)) cls = 'wrong'; return `<button class="opt ${cls}" data-opt="${k}" ${ok || s.wrong.includes(k) ? 'disabled' : ''}><b>${String.fromCharCode(65 + k)}</b> ${o}</button>`; }).join('');
  let fb = '';
  if (ok) fb = `<div class="fb ${s.sel === q.ans || kind === 'quiz' || s.sel == null ? 'good' : 'bad'}"><b>${s.sel === q.ans || s.sel == null || kind === 'quiz' ? 'Correct. ' : 'Not quite. '}</b>${q.fb}</div>`;
  else if (s.wrong.length) fb = `<div class="fb bad"><b>Not quite.</b> Try again. Think about: ${a.terms.join(', ')}.</div>`;
  const act = ok ? (kind === 'predict' ? '<button class="btn" data-test>🔬 Test it in the lab</button>' : `<button class="btn" data-go="${CUR.idx === ACTS.length - 1 ? '#final' : '#act-' + (a.n + 1)}">Next activity</button>`) : `<button class="btn" data-check ${s.sel == null ? 'disabled' : ''}>Check my answer</button>`;
  return `<h4>${kind === 'predict' ? '🔮 Predict before you test' : '❓ Quick quiz'}</h4>${bi('<p><b>' + q.q + '</b></p>', hiq ? '<b>' + hiq + '</b>' : '')}<div class="opts" role="radiogroup">${opts}</div>${fb}${act}`;
}
function onGuideClick(e) {
  const a = CUR.act, st = Store.get(a.id), t = e.target.closest('button'); if (!t) return;
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.try != null) { const k = +t.dataset.try; a.steps[k].act(CUR.env); st.sb[k] = 1; Store.save(); const li = t.closest('li'); li.classList.add('done'); $('input', li).checked = true; checkAllSteps(); return; }
  if (t.dataset.opt != null) { const s = CUR.q[CUR.tab]; if (!s.done) { s.sel = +t.dataset.opt; $('#tabbody').innerHTML = qHTML(CUR.tab); } return; }
  if (t.dataset.check != null) {
    const kind = CUR.tab, q = a[kind], s = CUR.q[kind];
    if (kind === 'predict') { s.done = true; Store.mark(a.id, 'predict'); } else if (s.sel === q.ans) { s.done = true; Store.mark(a.id, 'quiz'); } else s.wrong.push(s.sel), s.sel = null;
    $('#tabbody').innerHTML = qHTML(kind); drawTabs(); return;
  }
  if (t.dataset.test != null) { a.predict.test(CUR.env); CUR.env.say('Now watch the experiment and compare with your prediction'); }
}
function onGuideChange(e) { const k = e.target.dataset.chk; if (k == null) return; const a = CUR.act, st = Store.get(a.id); st.sb[+k] = e.target.checked ? 1 : 0; Store.save(); e.target.closest('li').classList.toggle('done', e.target.checked); checkAllSteps(); }
function checkAllSteps() { const a = CUR.act, st = Store.get(a.id); updateStepCount(); if (st.sb.every(Boolean)) { Store.mark(a.id, 'task'); drawTabs(); } }

/* ---------- final quiz ---------- */
function renderFinal() { FINAL = { i: 0, score: 0, picked: null, missed: [] }; drawFinal(); }
function drawFinal() {
  const v = $('#view'); v.style.setProperty('--c', '#ffd23d');
  if (FINAL.i >= FQ.length) {
    const s = FINAL.score; if (Store.d.final == null || s > Store.d.final) { Store.d.final = s; Store.save(); updateProgress(); }
    const msg = s >= 9 ? 'Light master! You are ready to teach this lab.' : s >= 6 ? 'Well done. You passed the knowledge check.' : 'Good try. Revisit the activities below and try again.';
    v.innerHTML = `<div class="card quizbox"><h2>Your result</h2><div class="score">${s} / ${FQ.length}</div><p>${msg}</p>
    ${FINAL.missed.length ? '<h4>Review these activities</h4><ul>' + FINAL.missed.map(m => `<li><a href="#act-${ACTS[m.act].n}" style="color:var(--c)">Act ${ACTS[m.act].n}: ${ACTS[m.act].title}</a></li>`).join('') + '</ul>' : '<p>You answered everything correctly.</p>'}
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="again">Try again</button><button class="btn ghost" data-go="#home">Back to dashboard</button></div></div>`;
    $('#again').onclick = renderFinal; return;
  }
  const q = FQ[FINAL.i], p = FINAL.picked, ans = p != null;
  v.innerHTML = `<div class="card quizbox"><div style="color:var(--mut);font-size:.9rem">Question ${FINAL.i + 1} of ${FQ.length} &nbsp; Score ${FINAL.score}</div>
  <h2>${q.q}</h2><div class="opts">${q.o.map((o, k) => `<button class="opt ${ans ? (k === q.a ? 'right' : (k === p ? 'wrong' : '')) : ''}" data-fo="${k}" ${ans ? 'disabled' : ''}><b>${String.fromCharCode(65 + k)}</b> ${o}</button>`).join('')}</div>
  ${ans ? `<div class="fb ${p === q.a ? 'good' : 'bad'}"><b>${p === q.a ? 'Correct. ' : 'Not quite. '}</b>${q.e}</div><button class="btn" id="nextq">${FINAL.i === FQ.length - 1 ? 'See my result' : 'Next question'}</button>` : ''}</div>`;
  $$('[data-fo]').forEach(b => b.onclick = () => { const k = +b.dataset.fo; FINAL.picked = k; if (k === q.a) FINAL.score++; else FINAL.missed.push(q); drawFinal(); });
  const nx = $('#nextq'); if (nx) nx.onclick = () => { FINAL.i++; FINAL.picked = null; drawFinal(); };
}

/* ---------- boot ---------- */
document.addEventListener('click', e => { const t = e.target.closest('[data-go]'); if (t && !t.closest('#tabbody')) { e.preventDefault(); go(t.dataset.go); } });
function rerenderLang() { if (CUR && CUR.act) drawTab(); else route(); }
window.addEventListener('hashchange', route);
$('#logoBtn').onclick = () => go('#home');

$('#presBtn').onclick = () => { Store.d.pres = !Store.d.pres; Store.save(); document.body.classList.toggle('presenter', Store.d.pres); $('#presBtn').setAttribute('aria-pressed', Store.d.pres); };
Store.load(); document.body.classList.toggle('presenter', !!Store.d.pres); $('#presBtn').setAttribute('aria-pressed', !!Store.d.pres);
function hideLinks() { $$('[data-go="#home"],[data-go="#final"]').forEach(e => { e.style.display = 'none'; }); }
new MutationObserver(hideLinks).observe(document.body, { childList: true, subtree: true });
updateProgress(); route(); hideLinks(); requestAnimationFrame(loop);

</script>
</body>
